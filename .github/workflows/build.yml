
name: Compilar Futebol 3D APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair projeto
        run: unzip Futebol3D_Android_Projeto.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Compilar APK
        working-directory: Futebol3D_Android
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Futebol3D-debug-apk
          path: Futebol3D_Android/app/build/outputs/apk/debug/app-debug.apk
